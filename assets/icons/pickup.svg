  <!-- Toit de la cabine -->
  <rect x="10" y="12" width="12" height="8" fill="#E17055" rx="4"/>
  
  <!-- Benne -->
  <rect x="24" y="24" width="16" height="12" fill="#FDCB6E" rx="2"/>
  
  <!-- Roue arrière -->
  <circle cx="16" cy="36" r="6" fill="#2D3436" stroke="#636E72" stroke-width="2"/>
  <circle cx="16" cy="36" r="3" fill="#FFFFFF"/>
  
  <!-- Roue avant -->
  <circle cx="32" cy="36" r="6" fill="#2D3436" stroke="#636E72" stroke-width="2"/>
  <circle cx="32" cy="36" r="3" fill="#FFFFFF"/>
  
  <!-- Phares -->
